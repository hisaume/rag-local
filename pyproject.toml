[project]
name = "rag"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = []

[tool.uv.build-backend]
module-name = "rag"

[project.scripts]
"rag" = "rag.__main__:main"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
